name: Build
run-name: ${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
on:
  push:
  workflow_dispatch:
    inputs:
      mode:        { type: choice, options: [ci, deploy], default: ci }
      ref:         { description: Tag or branch to deploy, required: false }
      account_id:  { description: Target AWS account ID, required: false }
      lambda_role: { description: Lambda execution role name, required: false }
      run_id:      { description: Unique marker used as the run name, required: false, type: string }

permissions:
  id-token: write
  contents: write  # semantic-release-dry verifies the write permissions
  issues: read # needed by semantic-release
  pull-requests: write # needed by semantic-release

jobs:
  ci:
    uses: adobe/helix-shared-workflows/.github/workflows/lambda.yaml@v1
    with:
      mode:        ${{ inputs.mode || 'ci' }}
      ref:         ${{ inputs.ref }}
      account-id:  ${{ inputs.account_id }}
      lambda-role: ${{ inputs.lambda_role || 'helix-service-role-s3-rw' }}
      lint: false
    secrets: inherit
